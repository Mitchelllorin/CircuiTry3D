    <!-- ── Dev-server service-worker breaker ──────────────────────────────
         Runs INLINE, in the HTML, on purpose — and this placement is the whole
         point of it, not a detail.

         sw.js serves HTML network-first but every other asset CACHE-first. On
         a dev origin that combination is poison: you get a fresh page shell, so
         the title paints, and then the app's JavaScript comes out of a cache
         built days ago. React never mounts and you are left staring at the
         background colour. "Blank blue screen after the title" is the exact
         signature.

         The app's own eviction code cannot fix this, because that code lives in
         the very bundle being served stale — it never runs. Only something in
         index.html can break the deadlock, since index.html is the one thing
         fetched from the network.

         Scoped to port 3000 (the vite dev server) so production PWA caching,
         which is a real feature, is untouched. Session-flagged so a failure can
         never become a boot loop. -->
    <script>
      (function () {
        if (location.port !== '3000' || !('serviceWorker' in navigator)) return;
        var FLAG = 'ct3d:dev-sw-breaker';
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          var controlled = !!navigator.serviceWorker.controller;
          return Promise.all(
            regs.map(function (r) { return r.unregister().catch(function () { return false; }); })
          ).then(function () {
            return (typeof caches !== 'undefined' && caches.keys)
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) {
                    return caches.delete(k).catch(function () { return false; });
                  }));
                })
              : null;
          }).then(function () {
            // Unregistering does not evict the worker already serving THIS
            // page, so the assets in flight are still the stale ones.
            if (!controlled) return;
            try {
              if (sessionStorage.getItem(FLAG)) return;
              sessionStorage.setItem(FLAG, '1');
            } catch (e) { return; }
            console.warn('[SW] Dev service worker evicted — reloading for fresh assets');
            location.reload();
          });
        }).catch(function () {});
      })();
    </script>

      /* ── The boot screen, which is deliberately BLANK ──────────────────
         This used to draw the wordmark in flat CSS text — "Circui" in blue,
         "Try" in orange, "3D" in green — over "Loading / Initializing…". It
         was a second landing page standing in front of the real one: you got
         a couple of seconds of flat lettering, it vanished, and only then did
         the actual 3D logo and Launch App screen arrive.

         Two landing screens in a row is one too many, and the flat one is the
         worse of the two — it is a hand-drawn imitation of a mark this app
         renders properly in three dimensions a moment later.

         So the layer stays and the picture goes. It still has a job: if the
         JS bundle never arrives (offline, 404, a stale cache), something has
         to tell the user rather than leave them on an empty background. That
         message is written in by the script below, and only after 10s — so in
         the normal case this element paints one colour and is removed without
         ever having been noticed. The colour is landing.html's own --bg, so
         the handover to the real screen is invisible. */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        z-index: 9999;
        background: #050b1f;
      }
    </style>

  <body>
    <!-- Boot screen. Empty on purpose — see .initial-loader above. It lives
         OUTSIDE #root so React's reconciliation cannot touch it, and it holds
         nothing but the background colour until either the app signals ready
         (normal case: removed unseen) or the plain script below decides the
         bundle is not coming and writes a message into #loader-status. -->
    <div id="initial-loader" class="initial-loader">
      <div id="loader-status" style="font-size: 0.95rem; text-align: center; padding: 0 24px;"></div>
    </div>
    <div id="root"></div>

    <!-- Plain (non-module) fallback script — runs synchronously before the
         module bundle loads, so it is always registered regardless of network
         conditions. It says NOTHING for the first 10 s: a normal boot is over
         long before that, and a progress message the user never needed is
         exactly the splash screen this element stopped being. After 10 s it
         explains the delay, and after 20 s it offers a Refresh button, so a
         bundle that never arrives is never a silent blank screen. -->
    <script>
      (function () {
        var loaderEl = document.getElementById('initial-loader');
        var statusEl = document.getElementById('loader-status');

        // Listen for the app-ready signal dispatched by main.tsx / App.tsx.
        document.addEventListener('ctapp:ready', function () {
          if (loaderEl) {
            loaderEl.style.transition = 'opacity 0.3s ease';
            loaderEl.style.opacity = '0';
            setTimeout(function () {
              if (loaderEl && loaderEl.parentNode) loaderEl.parentNode.removeChild(loaderEl);
            }, 320);
          }
        }, { once: true });

        // After 10 s without a ready signal, update the status text so the
        // user knows the load is taking longer than expected.
        var slowTimer = setTimeout(function () {
          if (statusEl) {
            statusEl.textContent = 'Still loading\u2026 please check your connection.';
            statusEl.style.color = 'rgba(255, 180, 80, 0.85)';
          }
        }, 10000);

        // After 20 s, force-remove the loader and show a refresh prompt so
        // the user is never stuck on the loading screen indefinitely.
        setTimeout(function () {
          clearTimeout(slowTimer);
          if (!loaderEl) return;
          if (statusEl) {
            statusEl.textContent = 'Unable to load \u2014 please refresh the page.';
            statusEl.style.color = 'rgba(255, 100, 80, 0.9)';
          }
          // Add a visible refresh button
          var btn = document.createElement('button');
          btn.textContent = 'Refresh';
          btn.style.cssText = 'margin-top:18px;padding:10px 28px;background:#00ff88;color:#0a0a1a;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:0.06em;';
          btn.onclick = function () { window.location.reload(); };
          loaderEl.appendChild(btn);
        }, 20000);
      })();
    </script>

    <script type="module" src="src/main.tsx"></script>
  </body>
