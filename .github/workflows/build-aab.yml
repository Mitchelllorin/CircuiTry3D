name: Build AAB

# AUTOMATIC ON MAIN, straight to PRODUCTION.
#
# A push to main builds a signed bundle and uploads it to the Play PRODUCTION
# track. That is the whole release process now: merge, and the live app updates.
#
# It used to go to internal first, which meant a second hand-promotion step in
# the Play Console on every single release — strictly more work than the manual
# upload it was meant to replace. The merging itself is the decision.
#
# The one thing that changed on the way: TESTS GATE THE UPLOAD. `ci.yml` runs the
# same suite on the same push, but in a PARALLEL job it cannot hold the upload
# back, so a red merge could reach real users. The suite now runs in this job too,
# before the bundle is built, and a failing test stops the run before anything is
# signed or uploaded.
#
# It runs `npm test`, not `npm run test:coverage`, on purpose. The coverage
# thresholds in this repo (80% lines) have never been met — `ci.yml` has been red
# on every single push for that reason alone while all 669 tests pass. A release
# gate that is permanently red is not a gate, it is a wall, and the first thing
# anyone does with a wall is route around it. `ci.yml` keeps enforcing coverage so
# the number stays visible; this job enforces correctness.
#
# Manual runs still exist, and still default to production:
#
#   gh workflow run build-aab.yml
#   gh workflow run build-aab.yml -f track=internal      # testers only
#
# Or Actions > Build AAB > "Run workflow".
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0). Leave blank to auto-generate as 1.0.<run_number>.'
        required: false
        default: ''
      version_code:
        description: 'Version code (integer, must be higher than any code Play has seen). Leave blank for <run_number> + 2.'
        required: false
        default: ''
      track:
        description: 'Play track to upload to. production = the live app; internal = testers only.'
        required: false
        default: 'production'
        type: choice
        options: [production, alpha, internal, beta]

# One AAB build at a time, so two runs cannot upload to the same track at once
# with competing version codes.
#
# Cancel behaviour differs by trigger on purpose. A push build is a release, so
# a second push QUEUES behind it rather than killing it — cancelling would
# silently leave a merge unreleased. A manual run is somebody waiting on it, so
# it supersedes whatever is running.
concurrency:
  group: build-aab
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The [skip screenshots] guard is meaningful now that pushes trigger this:
    # the screenshot bot commits images only, nothing to install, and shipping it
    # would spend a version code on a PNG. Manual runs are exempt — somebody
    # asked. (`head_commit` does not exist on dispatch, so the event name is
    # checked first.)
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip screenshots]')
    env:
      JAVA_VERSION: '21'
      NODE_VERSION: '20.19.0'
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short commit SHA
        shell: bash
        run: echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # The gate. A push here publishes to PRODUCTION, so the suite runs in this
      # job rather than trusting the parallel CI run to have finished — `ci.yml`
      # cannot block an upload it does not gate, and a failing merge must stop
      # before signing, not merely be reported afterwards.
      #
      # Plain `npm test`, deliberately: the coverage thresholds are unmet on main
      # and always have been (see the note at the top), so gating on them would
      # block every release until the repo's coverage policy changed. This gates on
      # the tests actually passing, which is what a release needs to know.
      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build -- --mode capacitor
        env:
          # Repository VARIABLES, not secrets: an affiliate tracking id travels
          # in the URL of every link it is attached to, so it is public by
          # design and masking it in the logs would only make a build harder to
          # debug. Unset is a safe state — the links then ship untagged and
          # undisclosed rather than tagged to nobody.
          # Set at: Settings > Secrets and variables > Actions > Variables.
          VITE_AMAZON_ASSOCIATES_TAG: ${{ vars.VITE_AMAZON_ASSOCIATES_TAG }}
          VITE_AMAZON_MARKETPLACE: ${{ vars.VITE_AMAZON_MARKETPLACE }}
          VITE_AMAZON_ASSOCIATES_TAGS: ${{ vars.VITE_AMAZON_ASSOCIATES_TAGS }}
          VITE_AFFILIATE_ENABLED: ${{ vars.VITE_AFFILIATE_ENABLED }}

      - name: Clear stale Android web assets
        # Ensures cap sync always starts from a clean state so every AAB reflects
        # the latest merged web changes. Keep these paths in sync with build-android.sh.
        run: rm -rf android/app/src/main/assets/public android/app/src/main/assets/capacitor.config.json android/app/src/main/assets/capacitor.plugins.json

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify web assets were synced
        # Fail fast if the web assets directory is missing or empty — this would
        # produce an AAB without any app content.
        shell: bash
        run: |
          set -euo pipefail
          ASSETS_DIR="android/app/src/main/assets/public"
          if [ ! -d "${ASSETS_DIR}" ]; then
            echo "::error::Web assets directory '${ASSETS_DIR}' is missing after cap sync."
            exit 1
          fi
          FILE_COUNT=$(find "${ASSETS_DIR}" -type f | wc -l)
          # A minimal Vite build produces at least: index.html, manifest.webmanifest,
          # favicon, sw.js, and one JS chunk — so fewer than 5 files means the sync
          # produced an incomplete or empty web bundle.
          if [ "${FILE_COUNT}" -lt 5 ]; then
            echo "::error::Web assets appear incomplete: only ${FILE_COUNT} file(s) in '${ASSETS_DIR}'."
            exit 1
          fi
          # A count cannot catch the file that matters most going missing. The
          # builder's entire 3D workspace is one asset loaded in an iframe, and if
          # it (or its three.js bundle) fails to ship the app still boots normally
          # — you just get an empty workspace, which has repeatedly been misread as
          # a circuit bug rather than a packaging one. Assert them by name.
          for REQUIRED in index.html legacy.html vendor/three.min.js; do
            if [ ! -s "${ASSETS_DIR}/${REQUIRED}" ]; then
              echo "::error::Required web asset '${REQUIRED}' is missing or empty in '${ASSETS_DIR}' — the 3D workspace would be blank in this build."
              exit 1
            fi
          done
          echo "✔ Web assets synced — ${FILE_COUNT} files in ${ASSETS_DIR}"
          echo "  Critical assets present: index.html, legacy.html, vendor/three.min.js"
          echo "  Commit: ${GITHUB_SHA}"

      - name: Guard Capacitor generated Gradle include
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            sed -i "/cordova.variables.gradle/d" android/app/capacitor.build.gradle
          fi

      - name: Create release signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_FILENAME: ${{ secrets.ANDROID_KEYSTORE_FILENAME || secrets.KEYSTORE_FILENAME }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_STORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            ANDROID_STORE_PASSWORD="${ANDROID_KEY_PASSWORD}"
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ] && [ -n "${ANDROID_STORE_PASSWORD:-}" ]; then
            ANDROID_KEY_PASSWORD="${ANDROID_STORE_PASSWORD}"
          fi

          : "${ANDROID_STORE_PASSWORD:?Missing secret ANDROID_STORE_PASSWORD}"
          : "${ANDROID_KEY_PASSWORD:?Missing secret ANDROID_KEY_PASSWORD}"

          : "${ANDROID_KEYSTORE_BASE64:?Missing secret ANDROID_KEYSTORE_BASE64 — store the base64-encoded keystore in GitHub Secrets}"
          KEYSTORE_FILENAME="${ANDROID_KEYSTORE_FILENAME:-upload-key.jks}"
          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "android/app/keystore/${KEYSTORE_FILENAME}"

          # Determine the signing alias.  If ANDROID_KEY_ALIAS is set but does not exist in the
          # keystore (e.g. stale secret after a keystore reset), auto-detect the first alias found
          # in the keystore; fall back to the committed-keystore default when all else fails.
          CANDIDATE_ALIAS="${ANDROID_KEY_ALIAS:-circuitry3d-upload-reset}"
          if keytool -list \
               -keystore "android/app/keystore/${KEYSTORE_FILENAME}" \
               -alias "${CANDIDATE_ALIAS}" \
               -storepass "${ANDROID_STORE_PASSWORD}" \
               >/dev/null 2>&1; then
            KEY_ALIAS="${CANDIDATE_ALIAS}"
          else
            echo "::warning::Alias '${CANDIDATE_ALIAS}' not found in keystore; auto-detecting alias."
            # keytool -list output lines look like:
            #   <alias>, <date>, PrivateKeyEntry,
            DETECTED="$(keytool -list \
               -keystore "android/app/keystore/${KEYSTORE_FILENAME}" \
               -storepass "${ANDROID_STORE_PASSWORD}" 2>/dev/null \
               | grep -E ',[[:space:]]*(PrivateKeyEntry|SecretKeyEntry)' \
               | head -1 | cut -d',' -f1 | xargs)" || DETECTED=""
            KEY_ALIAS="${DETECTED:-circuitry3d-upload-reset}"
            echo "::notice::Using alias '${KEY_ALIAS}' for signing."
          fi

          # Verify the alias exists in the keystore; auto-detect the first available alias
          # when the configured alias is wrong (e.g. ANDROID_KEY_ALIAS secret has a stale value).
          ACTUAL_ALIASES=$(keytool -list -v \
            -keystore "android/app/keystore/${KEYSTORE_FILENAME}" \
            -storepass "${ANDROID_STORE_PASSWORD}" 2>/tmp/keytool-err.txt \
            | awk '/^Alias name:/ { print $3 }') || true
          if [ -n "${ACTUAL_ALIASES}" ]; then
            echo "Keystore aliases available: ${ACTUAL_ALIASES}"
            if ! printf '%s\n' "${ACTUAL_ALIASES}" | grep -qFx "${KEY_ALIAS}"; then
              DETECTED_ALIAS=$(printf '%s\n' "${ACTUAL_ALIASES}" | head -1)
              echo "::warning::ANDROID_KEY_ALIAS secret does not match any alias in the keystore (available: ${ACTUAL_ALIASES}). Auto-selecting '${DETECTED_ALIAS}'. Update the ANDROID_KEY_ALIAS secret to silence this warning."
              KEY_ALIAS="${DETECTED_ALIAS}"
            fi
          else
            KEYTOOL_ERR=$(cat /tmp/keytool-err.txt 2>/dev/null || true)
            echo "::warning::Could not list aliases from keystore (${KEYTOOL_ERR:-no error details}). Proceeding with configured alias — verify ANDROID_STORE_PASSWORD is correct and the keystore is not corrupted."
          fi

          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore/${KEYSTORE_FILENAME}
          EOF

      # A run-number offset is not a version code, it is a guess that only works
      # while the run number is the highest thing Play has ever seen. It was not:
      # production sat at 2000 from a hand upload while this workflow was at 750,
      # and Play rejected the first automatic release to production as a
      # downgrade — "does not allow any existing users to upgrade to the newly
      # added APKs". Nothing about the bundle was wrong; the number under it was.
      #
      # So ask Play what it holds and go one above it. The uploaded history stops
      # mattering, a hand upload can never wedge the pipeline again, and the run
      # number survives only as a floor for the case where the lookup cannot run.
      - name: Resolve version code and name
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -uo pipefail
          PKG=com.circuitry3d.app

          play_max() {
            local api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PKG}"
            local email header claim sig jwt token edit max bundles
            printf '%s' "${SA:-}" > /tmp/play-sa.json
            email=$(jq -r '.client_email // empty' /tmp/play-sa.json) || return 1
            jq -r '.private_key // empty' /tmp/play-sa.json > /tmp/play-key.pem || return 1
            [ -n "$email" ] && [ -s /tmp/play-key.pem ] || return 1

            local iat exp
            iat=$(date +%s); exp=$(( iat + 600 ))
            header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            claim=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' \
              "$email" "$iat" "$exp" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            sig=$(printf '%s.%s' "$header" "$claim" | openssl dgst -sha256 -sign /tmp/play-key.pem \
              | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            jwt="${header}.${claim}.${sig}"

            token=$(curl -sS -X POST https://oauth2.googleapis.com/token \
              -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}" \
              | jq -r '.access_token // empty') || return 1
            [ -n "$token" ] || return 1

            edit=$(curl -sS -X POST -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' "${api}/edits" | jq -r '.id // empty') || return 1
            [ -n "$edit" ] || return 1

            # Every release on every track AND every bundle ever uploaded. The two
            # endpoints disagree in practice (bundles came back empty while
            # production held 2000), so trust whichever reports the higher number.
            max=$(curl -sS -H "Authorization: Bearer ${token}" "${api}/edits/${edit}/tracks" \
              | jq -r '[.tracks[]?.releases[]?.versionCodes[]? | tonumber] | max // 0')
            bundles=$(curl -sS -H "Authorization: Bearer ${token}" "${api}/edits/${edit}/bundles" \
              | jq -r '[.versionCodes[]? | tonumber] | max // 0')
            if [ "${bundles:-0}" -gt "${max:-0}" ] 2>/dev/null; then max="$bundles"; fi

            # Abandon the edit — this step only reads.
            curl -sS -X DELETE -H "Authorization: Bearer ${token}" "${api}/edits/${edit}" -o /dev/null || true
            printf '%s' "${max:-0}"
          }

          MAX_LIVE=0
          if [ -z "${INPUT_VERSION_CODE:-}" ] && [ -n "${SA:-}" ]; then
            if OUT="$(play_max 2>/dev/null)"; then
              MAX_LIVE="${OUT:-0}"
              case "$MAX_LIVE" in ''|*[!0-9]*) MAX_LIVE=0 ;; esac
              echo "Play's highest version code: ${MAX_LIVE}"
            else
              echo "::warning::Could not read the live version code from Play. Falling back to the run-number floor — if Play rejects the upload as a downgrade, this is why."
              MAX_LIVE=0
            fi
          fi
          rm -f /tmp/play-sa.json /tmp/play-key.pem

          if [ -n "${INPUT_VERSION_CODE:-}" ]; then
            VERSION_CODE="$(echo "${INPUT_VERSION_CODE}" | tr -cd '0-9')"
            echo "::notice::Manual run set the version code explicitly: ${VERSION_CODE} (Play's highest is ${MAX_LIVE}, this overrides it)."
          else
            # Above Play, and above the run number, so the code always climbs
            # whichever of the two is currently larger.
            FLOOR=$(( GITHUB_RUN_NUMBER + 2 ))
            VERSION_CODE=$(( MAX_LIVE + 1 ))
            if [ "${VERSION_CODE}" -lt "${FLOOR}" ]; then VERSION_CODE="${FLOOR}"; fi
            echo "Version code for this build: ${VERSION_CODE}"
          fi
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          if [ -n "${INPUT_VERSION_NAME}" ]; then
            # Sanitize: allow only alphanumeric characters, dots, and hyphens
            SAFE_VERSION_NAME="$(echo "${INPUT_VERSION_NAME}" | tr -cd '[:alnum:].-')"
            echo "VERSION_NAME=${SAFE_VERSION_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${VERSION_CODE}" >> "$GITHUB_ENV"
          fi

      - name: Ensure Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Release (AAB + sideloadable APK)
        # assembleRelease rides along with bundleRelease because an AAB cannot be
        # installed on a phone — Play consumes it and generates split APKs. The APK
        # is the same release build type (same minify/shrink, same signing key), so
        # it is the closest thing to the Play build that can be tested on a device
        # without going through the Play pipeline.
        run: |
          cd android
          ./gradlew clean bundleRelease assembleRelease -PversionCode="${{ env.VERSION_CODE }}" -PversionName="${{ env.VERSION_NAME }}" --stacktrace --no-build-cache --no-configuration-cache

      - name: Collect build outputs into release folder
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="CircuiTry3D-Release"
          mkdir -p "${RELEASE_DIR}"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "${RELEASE_DIR}/CircuiTry3D-v${{ env.VERSION_NAME }}.aab"
          cp android/app/build/outputs/mapping/release/mapping.txt \
             "${RELEASE_DIR}/mapping.txt" \
             || echo "::warning::Mapping file not found — skipping"
          echo "Contents of ${RELEASE_DIR}:"
          ls -lh "${RELEASE_DIR}"

          # The phone-installable build, kept in its own folder so it uploads as a
          # separate, small artifact — the one to download when testing on a device.
          APK_DIR="CircuiTry3D-APK"
          mkdir -p "${APK_DIR}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "${APK_DIR}/CircuiTry3D-v${{ env.VERSION_NAME }}.apk"
          ls -lh "${APK_DIR}"

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: CircuiTry3D-v${{ env.VERSION_NAME }}
          path: CircuiTry3D-Release/
          if-no-files-found: error

      - name: Upload sideloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: CircuiTry3D-v${{ env.VERSION_NAME }}-APK
          path: CircuiTry3D-APK/
          if-no-files-found: error

      # Production unless a manual run picks another track. A push has no inputs,
      # so `github.event.inputs.track` is empty there and falls through to
      # 'production' — main IS the release, and the tests above are what stands
      # between a bad merge and real users. Pass `-f track=internal` to put a
      # build in front of testers instead.
      - name: Publish to Google Play
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.circuitry3d.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          # `tracks` (plural), not `track`: the singular input is deprecated in
          # this action and slated for removal, and when it goes the upload would
          # have no track at all. Verified working on run 40937558306's successor.
          tracks: ${{ github.event.inputs.track || 'production' }}
          status: completed

      - name: Build summary
        if: always()
        shell: bash
        run: |
          commit_msg="$(git log -1 --pretty=%s 2>/dev/null | tr '|`' '//' | cut -c1-80 || echo 'unknown')"
          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            play_status="✅ Uploaded to the ${{ github.event.inputs.track || 'production' }} track"
          else
            play_status="⏭ Skipped — add \`GOOGLE_PLAY_SERVICE_ACCOUNT_JSON\` secret to enable auto-upload"
          fi
          {
            echo "## Build Summary"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Commit** | \`${GITHUB_SHA}\` |"
            echo "| **Branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **Message** | ${commit_msg} |"
            echo "| **Version name** | ${VERSION_NAME:-unknown} |"
            echo "| **Version code** | ${VERSION_CODE:-unknown} |"
            echo "| **Artifact** | \`CircuiTry3D-v${VERSION_NAME:-unknown}\` |"
            echo "| **Play Store upload** | ${play_status} |"
          } >> "$GITHUB_STEP_SUMMARY"